name: SDK documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/check_pages.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/check_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Match the lockfile package manager
        run: npm install --global npm@11.16.0
      - run: npm ci --prefix docs
      - name: Build bilingual SDK documentation
        run: npm run build --prefix docs
        env:
          DESKTILE_DOCS_BASE: /DeskTile-DevKit/
      - name: Check deployed resource paths
        run: python3 tools/check_pages.py site --base /DeskTile-DevKit/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
